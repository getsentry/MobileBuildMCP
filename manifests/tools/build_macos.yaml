id: build_macos
module: mcp/tools/macos/build_macos
names:
  mcp: build_macos
  cli: build
description: Build macOS app.
outputSchema:
  schema: mobilebuildmcp.output.build-result
  version: '3'
predicates:
  - hideWhenXcodeAgentMode
annotations:
  title: Build macOS
  readOnlyHint: false
  destructiveHint: false
  openWorldHint: false
nextSteps:
  - label: Get built macOS app path
    toolId: get_mac_app_path
    priority: 1
    when: success
    condition: app_build_succeeded
  - label: Run prepared tests
    toolId: test_macos
    when: success
    condition: prepared_tests_available
