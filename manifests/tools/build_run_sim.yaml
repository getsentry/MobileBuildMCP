id: build_run_sim
module: mcp/tools/simulator/build_run_sim
names:
  mcp: build_run_sim
  cli: build-and-run
description: Build, install, and launch on iOS Simulator, booting it when needed. Runtime logs are captured automatically and the log file path is included in the response. Preferred single-step run tool when defaults are set.
outputSchema:
  schema: mobilebuildmcp.output.build-run-result
  version: "2"
predicates:
  - hideWhenXcodeAgentMode
annotations:
  title: Build Run Simulator
  readOnlyHint: false
  destructiveHint: false
  openWorldHint: false
nextSteps:
  - label: Stop app in simulator
    toolId: stop_app_sim
    priority: 1
    when: success
