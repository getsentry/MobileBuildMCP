id: list_sims
module: mcp/tools/simulator/list_sims
names:
  mcp: list_sims
  cli: list
description: List iOS simulators.
outputSchema:
  schema: mobilebuildmcp.output.simulator-list
  version: "2"
annotations:
  title: List Simulators
  readOnlyHint: true
  destructiveHint: false
  openWorldHint: false
nextSteps:
  - label: Boot a simulator
    toolId: boot_sim
    params:
      simulatorId: UUID_FROM_ABOVE
    priority: 1
    when: success
  - label: Open the simulator UI
    toolId: open_sim
    priority: 2
    when: success
  - label: Build for simulator
    toolId: build_sim
    params:
      scheme: YOUR_SCHEME
      simulatorId: UUID_FROM_ABOVE
    priority: 3
    when: success
  - label: Get app path
    toolId: get_sim_app_path
    params:
      scheme: YOUR_SCHEME
      platform: iOS Simulator
      simulatorId: UUID_FROM_ABOVE
    priority: 4
    when: success
