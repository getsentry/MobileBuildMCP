id: simulator-management
title: Simulator Management
description: Tools for managing simulators from booting, opening simulators, listing simulators, stopping simulators, erasing simulator content and settings, and setting simulator environment options like location, network, statusbar and appearance.
targetPlatforms: [iOS, tvOS, watchOS, visionOS]
tools:
  - boot_sim
  - shutdown_sim
  - list_sims
  - open_sim
  - erase_sims
  - set_sim_location
  - reset_sim_location
  - set_sim_appearance
  - sim_statusbar
  - toggle_software_keyboard
  - toggle_connect_hardware_keyboard
